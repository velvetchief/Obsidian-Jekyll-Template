---
layout: default
---

<article>
  <div>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">
      Last updated on {{ page.last_modified_at | date: "%B %-d, %Y" }}
    </time>
  </div>

  <div id="gallery-content">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
  <div style="margin-top: 2em; color: var(--color-subtext);">
    {% for tag in page.tags %}
      <a class="internal-link" href="{{ site.baseurl }}/tags/{{ tag | slugify }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
  {% endif %}
</article>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  (function() {
    var container = document.getElementById('gallery-content');
    var imgs = Array.prototype.slice.call(container.querySelectorAll('img'));
    if (imgs.length === 0) return;

    // Find the first image's ancestor that is a direct child of container
    var firstImg = imgs[0];
    var firstImgBlock = firstImg;
    while (firstImgBlock.parentNode !== container) {
      firstImgBlock = firstImgBlock.parentNode;
    }

    // Everything before the first image block is intro
    var intro = document.createElement('div');
    var sibling = container.firstChild;
    while (sibling && sibling !== firstImgBlock) {
      var next = sibling.nextSibling;
      intro.appendChild(sibling);
      sibling = next;
    }

    // Build gallery grid from all images
    var grid = document.createElement('div');
    grid.className = 'gallery-grid';
    imgs.forEach(function(img) {
      var figure = document.createElement('figure');
      figure.className = 'gallery-item';
      figure.onclick = function() { openLightbox(this); };
      var newImg = img.cloneNode(true);
      newImg.loading = 'lazy';
      figure.appendChild(newImg);
      grid.appendChild(figure);
    });

    // Replace content
    container.innerHTML = '';
    if (intro.innerHTML.trim()) {
      container.appendChild(intro);
    }
    container.appendChild(grid);
  })();

  function openLightbox(el) {
    var img = el.querySelector('img');
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lightbox-img');
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    var lb = document.getElementById('lightbox');
    lb.classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>
